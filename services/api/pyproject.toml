[project]
name = "razormesh-api"
version = "0.1.0"
description = "RazorMesh Trust - Phase 1 local trust core API (modular monolith)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings>=2.6",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "redis==8.1.0",
    "cryptography==50.0.0",
    "rfc8785==0.1.4",
    "httpx==0.28.1",
    "uvicorn[standard]==0.52.4",
    "mcp==2.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=7",
    "hypothesis==6.165.10",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "httpx2==2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/razormesh_api"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security-sensitive codebase)
    "BLE",      # broad exception catching must be explicit + justified
    "ASYNC",    # async correctness
    "RUF",
]
ignore = [
    "S101",  # assert usage is expected inside tests; production asserts audited separately
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]  # hardcoded-test-string literals only in tests
"scripts/*" = ["T201"]
"training/*" = ["E501", "F401", "F811", "BLE001", "B008", "S105"]
# Alembic conventions: env.py must insert the src path before importing the app
# (late imports are inherent); migration files follow the upstream alembic
# template (typing.Sequence/Union); env.py falls back to the ini URL with a
# deliberately broad catch.
"**/alembic/*" = ["E402", "I001", "UP007", "UP035", "BLE001"]
# P2-M38: conftest.py MUST pin the test environment (DATABASE_URL etc.) before
# any razormesh_api import so get_settings() can never resolve the dev .env;
# env-pinning before imports is inherent (see the block comment in the file).
"**/tests/conftest.py" = ["E402"]
# Phase-4 protocol proof harnesses are long by design (full UCP/AP2/ACP
# assertion tables) and intentionally enumerate legal transitions / failure
# labels inline; brevity is not a virtue here.
"src/razormesh_api/protocol/*_proof.py" = ["E501", "BLE001", "S105"]
"src/razormesh_api/protocol/agentpay_x.py" = ["E501", "S105"]
"src/razormesh_api/protocol/untrusted_agent.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
mypy_path = "src"
packages = ["razormesh_api"]

[[tool.mypy.overrides]]
module = "rfc8785.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic_settings.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests requiring local Docker infrastructure",
    "security: security regression tests (release-blocking)",
    "concurrency: genuine parallel-race tests",
]

[tool.coverage.run]
source = ["src/razormesh_api"]
branch = true
