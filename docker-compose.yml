name: razormesh

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: razormesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: razormesh
      POSTGRES_PASSWORD: razormesh_local_dev
      POSTGRES_DB: razormesh
    # Loopback-only host binding; 5432 on the host belongs to an unrelated
    # local PostgreSQL that must remain untouched.
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      # PG 18+ official images expect the mount at /var/lib/postgresql
      # (data lives in a versioned subdirectory, enabling pg_upgrade --link).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razormesh -d razormesh"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Bounded resources for an 8 GB host
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:8.8.2-alpine
    container_name: razormesh-redis
    restart: unless-stopped
    # Coordination only (nonce claims / short locks) — never durable financial truth.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 192M

volumes:
  pgdata:
